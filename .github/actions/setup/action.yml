name: Set up Node and pnpm
description: Install Node (from .nvmrc) and pnpm (from packageManager), restore the store cache, and install dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Enable the pnpm version pinned in package.json
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: corepack enable
    # pnpm-workspace.yaml keeps the store inside the project.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .sites-runtime/pnpm-store
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-
    - name: Install dependencies
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: pnpm install --frozen-lockfile
